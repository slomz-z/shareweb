<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="HandheldFriendly" content="true">
  <title data-i18n="accessRestrictedTitle">Access Restricted — ShareWeb</title>
  <link rel="canonical" href="https://shareweb.slomz.is-a.dev/manage-forbidden" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/lock-frame.js"></script>
  <script src="/page-i18n.js"></script>
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .card {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(220, 60, 60, 0.15);
      color: var(--red, #ef4444);
      display: inline-grid;
      place-items: center;
      margin-bottom: 20px;
      border: 1px solid rgba(220, 60, 60, 0.3);
    }
    h2 { margin: 0 0 10px; font-size: 22px; font-weight: 700; color: var(--text); }
    p { margin: 0 0 24px; color: var(--text-soft); font-size: 14px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-strong, #3d3dbf); }
    html[dir="rtl"] body { text-align: right; }
    html[dir="rtl"] .card { text-align: right; }
  </style>
  <style id="global-loader-crit-css">
    #global-page-loader {
      position: fixed; inset: 0; z-index: 99999999;
      background: #090a10;
      color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.32s;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) #global-page-loader {
        background: #f4f5fb;
        color: #1e293b;
      }
      :root:not([data-theme="dark"]) #global-page-loader .loader-status-text {
        color: #64748b;
      }
    }
    :root[data-theme="light"] #global-page-loader {
      background: #f4f5fb !important;
      color: #1e293b !important;
    }
    :root[data-theme="light"] #global-page-loader .loader-status-text {
      color: #64748b !important;
    }
  </style>
</head>
<body>
  <!-- Global Page Loader (Zero-FOUC Barrier) -->
  <div id="global-page-loader" class="page-loading-barrier" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-logo-wrap">
        <img src="/icons/icon-512.png" alt="ShareWeb" class="loader-logo-img" />
      </div>
      <div class="loader-spinner"></div>
      <span class="loader-status-text" data-i18n="loading">Loading...</span>
    </div>
  </div>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h2 data-i18n="accessRestrictedTitle">Access Restricted</h2>
    <p data-i18n="accessRestrictedText">This management console is restricted to ShareWeb Owner and Moderator accounts only.</p>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <a href="/app" class="btn" data-i18n="returnToApp">Return to App</a>
      <a href="/support" class="btn" style="background:#282c44; border:1px solid #3b4261;" data-i18n="supportAppeals">Support & Appeals</a>
    </div>
  </div>
</body>
</html>
