<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="HandheldFriendly" content="true">
  <title data-i18n="adminSignInTitle">Admin Sign In — ShareWeb</title>
  <link rel="canonical" href="https://shareweb.slomz.is-a.dev/manage-login" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/lock-frame.js"></script>
  <script src="/page-i18n.js"></script>
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .card {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(74, 74, 217, 0.15);
      color: var(--primary);
      display: inline-grid;
      place-items: center;
      margin-bottom: 20px;
      border: 1px solid rgba(74, 74, 217, 0.3);
    }
    h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; color: var(--text); }
    p.sub { margin: 0 0 24px; color: var(--text-soft); font-size: 13.5px; line-height: 1.5; }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 600;
      font-size: 14.5px;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 12px;
    }
    .btn-google:hover { background: var(--border); transform: translateY(-1px); }
    .btn-email {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14.5px;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-email:hover { background: var(--primary-strong); opacity: 0.95; }
    html[dir="rtl"] body { text-align: right; }
    html[dir="rtl"] .card { text-align: right; }
    html[dir="rtl"] .btn-corner-back { left: auto; right: 24px; flex-direction: row-reverse; }
  </style>
  <style id="global-loader-crit-css">
    #global-page-loader {
      position: fixed; inset: 0; z-index: 99999999;
      background: #090a10;
      color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.32s;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) #global-page-loader {
        background: #f4f5fb;
        color: #1e293b;
      }
      :root:not([data-theme="dark"]) #global-page-loader .loader-status-text {
        color: #64748b;
      }
    }
    :root[data-theme="light"] #global-page-loader {
      background: #f4f5fb !important;
      color: #1e293b !important;
    }
    :root[data-theme="light"] #global-page-loader .loader-status-text {
      color: #64748b !important;
    }
  </style>
</head>
<body>
  <!-- Global Page Loader (Zero-FOUC Barrier) -->
  <div id="global-page-loader" class="page-loading-barrier" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-logo-wrap">
        <img src="/icons/icon-512.png" alt="ShareWeb" class="loader-logo-img" />
      </div>
      <div class="loader-spinner"></div>
      <span class="loader-status-text" data-i18n="loading">Loading...</span>
    </div>
  </div>
  <a href="/" class="btn-corner-back" aria-label="Back to home" data-i18n-title="btnBackHome">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    <span data-i18n="btnBackHome">Back to home</span>
  </a>
  <div class="card">
    <img class="logo-img login" src="/icons/icon-512.png" alt="ShareWeb" style="width: 56px; height: 56px; margin-bottom: 18px; border-radius: 16px;" />
    <h2 data-i18n="adminSignInTitle">Admin Sign In</h2>
    <p class="sub" data-i18n="adminSignInSub">Sign in with an authorized Owner or Moderator account to access the management console.</p>
    
    <a href="/auth/google" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      <span data-i18n="signInGoogle">Sign in with Google</span>
    </a>
    <a href="/login" class="btn-email" data-i18n="adminSignInEmail">Sign in with Email</a>
  </div>
</body>
</html>
